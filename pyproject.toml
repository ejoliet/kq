[project]
name = "kq"
version = "0.1.0"
description = "Session kernel for coding agents: large command output becomes queryable DuckDB artifacts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["duckdb>=1.5,<2"]

[project.optional-dependencies]
otel = [
    "opentelemetry-sdk~=1.45",
    "opentelemetry-exporter-otlp-proto-http~=1.45",
]

[project.scripts]
kq = "kq.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kq"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
